name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_cuda:
        description: Run CUDA tests on a provisioned self-hosted GPU runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  numpy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q -rs
      - run: python examples/quickstart.py
      - run: python examples/controlled.py
      - run: python -m build
      - run: python -m twine check dist/*

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q -rs

  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Require a provisioned CUDA environment
        run: python -c 'import torch; assert torch.cuda.is_available(), "CUDA must be available for this job"; print(torch.__version__, torch.cuda.get_device_name(0))'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -rs
      - run: python benchmarks/benchmark.py --backends torch-cuda --features 128 --snapshots 100 --rank 6 --repeats 3 --output cuda-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-validation
          path: cuda-validation.json
