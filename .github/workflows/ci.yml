name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_cuda:
        description: Run CUDA tests on a provisioned self-hosted GPU runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  numpy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        numpy: [latest]
        include:
          - python: '3.10'
            numpy: minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - if: matrix.numpy == 'minimum'
        run: python -m pip install numpy==1.24.0
      - run: python -m ruff check .
      - run: python -m pytest -q -rs
      - run: python examples/quickstart.py
      - run: python examples/controlled.py
      - run: python -m build
      - run: python -m twine check dist/*

  distributions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_artifacts.py

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q -rs

  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a provisioned CUDA environment
        run: python -c 'import torch; assert torch.cuda.is_available(), "CUDA must be available for this job"; print(torch.__version__, torch.cuda.get_device_name(0))'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -rs
      - run: python benchmarks/benchmark.py --backends torch-cuda --features 128 --snapshots 100 --rank 6 --repeats 3 --output cuda-validation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-validation
          path: cuda-validation.json
