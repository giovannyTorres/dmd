name: Publish package

on:
  push:
    branches: ['release/0.1.2']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated release tag, for example v0.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'giovannyTorres/dmd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Match release tag and installed metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.1.2' }}
        run: python -c 'import importlib.metadata, os, modaldyn; version = importlib.metadata.version("modaldyn"); assert version == modaldyn.__version__; assert os.environ["RELEASE_TAG"] == "v" + version, "Tag must match the package version"'
      - run: python -m pytest -q -rs
      - run: python examples/quickstart.py
      - run: python examples/controlled.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/modaldyn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
