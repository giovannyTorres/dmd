name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated release tag, for example v0.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'giovannyTorres/dmd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Match release tag and installed metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c 'import importlib.metadata, os; version = importlib.metadata.version("modaldyn"); assert os.environ["RELEASE_TAG"] == "v" + version, "Tag must match the package version"'
      - run: python -m pytest -q -rs
      - run: python examples/quickstart.py
      - run: python examples/controlled.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv /tmp/modaldyn-release-check
          /tmp/modaldyn-release-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/modaldyn-release-check/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
          /tmp/modaldyn-release-check/bin/python "$GITHUB_WORKSPACE/examples/controlled.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/modaldyn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
